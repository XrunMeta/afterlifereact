<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>클론 대화 LLM 검증</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, system-ui, sans-serif; color: #1d2129; }
  header { padding: 10px 14px; background: #1d2129; color: #fff; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header input, header select, header button { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #444; }
  header input[type=text], header input[type=password] { min-width: 200px; }
  header label { display: flex; align-items: center; gap: 4px; }
  main { display: flex; height: calc(100vh - 52px); }
  #chat { flex: 1 1 60%; display: flex; flex-direction: column; border-right: 1px solid #ddd; }
  #log { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; max-width: 80%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .user { background: #0b66ff; color: #fff; margin-left: auto; }
  .assistant { background: #eef0f3; }
  #inbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #ddd; }
  #inbar textarea { flex: 1; resize: none; height: 44px; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font: inherit; }
  #inbar button { padding: 0 18px; border-radius: 8px; border: 0; background: #0b66ff; color: #fff; cursor: pointer; }
  #dbg { flex: 1 1 40%; overflow-y: auto; padding: 14px; background: #fafbfc; }
  #dbg h3 { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; color: #65676b; }
  pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid #e4e6eb; border-radius: 8px; padding: 10px; font: 12px/1.45 ui-monospace, monospace; }
  .muted { color: #8a8d91; }
</style>
</head>
<body>
<header>
  <input id="apiBase" type="text" placeholder="API base (예: https://edge-alt-preview.example.invalid)" />
  <input id="email" type="text" placeholder="email" style="min-width:150px" />
  <input id="password" type="password" placeholder="password" style="min-width:120px" />
  <button id="login">로그인</button>
  <input id="token" type="password" placeholder="access token" />
  <button id="loadClones">클론 불러오기</button>
  <select id="clone"><option value="">— 클론 —</option></select>
  <input id="model" type="text" placeholder="model (기본값)" style="width:130px" />
  <label>temp <input id="temp" type="number" min="0" max="2" step="0.1" style="width:60px" /></label>
  <label><input id="multiturn" type="checkbox" checked /> 멀티턴</label>
  <label><input id="useOverride" type="checkbox" /> system override</label>
  <button id="reset">초기화</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div id="inbar">
      <textarea id="text" placeholder="메시지 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button id="send">전송</button>
    </div>
  </section>
  <aside id="dbg">
    <h3>system override (체크 시 사용)</h3>
    <textarea id="overrideText" style="width:100%;height:90px" placeholder="여기 내용이 persona system을 대체합니다"></textarea>
    <h3>최종 messages (마지막 응답)</h3>
    <pre id="finalMessages" class="muted">아직 없음</pre>
    <h3>persona bundle (raw)</h3>
    <pre id="personaBundle" class="muted">아직 없음</pre>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const LS = "verify_chat_cfg";

const cfg = JSON.parse(localStorage.getItem(LS) || "{}");
$("apiBase").value = cfg.apiBase || location.origin;
$("token").value = cfg.token || "";
const saveCfg = () => localStorage.setItem(LS, JSON.stringify({apiBase: $("apiBase").value, token: $("token").value}));
$("apiBase").addEventListener("change", saveCfg);
$("token").addEventListener("change", saveCfg);

let history = [];  

function addBubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}

$("reset").onclick = () => { history = []; $("log").innerHTML = ""; };

$("login").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) { alert("이메일/비밀번호를 입력하세요"); return; }
  const r = await fetch("/oth-path", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });
  if (!r.ok) { alert("로그인 실패: " + r.status); return; }
  const { accessToken } = await r.json();
  if (!accessToken) { alert("토큰 없음"); return; }
  $("token").value = accessToken;
  saveCfg();

  $("loadClones").click();
};

$("loadClones").onclick = async () => {
  const r = await fetch("/oth-path", { headers: { Authorization: "Bearer " + $("token").value } });
  const sel = $("clone");
  if (!r.ok) { alert("클론 로드 실패: " + r.status); return; }
  const { clones } = await r.json();
  sel.innerHTML = '<option value="">— 클론 —</option>';
  for (const c of clones) {
    const o = document.createElement("option");
    o.value = c.id; o.textContent = `${c.name} (#${c.id})`;
    sel.appendChild(o);
  }
};

async function send() {
  const text = $("text").value.trim();
  const cloneId = parseInt($("clone").value, 10);
  if (!text) return;
  if (!cloneId) { alert("클론을 선택하세요"); return; }
  $("text").value = "";
  addBubble("user", text);
  history.push({ role: "user", content: text });

  const multiturn = $("multiturn").checked;
  const messages = multiturn ? history.slice() : [{ role: "user", content: text }];

  const body = { clone_id: cloneId, messages };
  if ($("model").value.trim()) body.model = $("model").value.trim();
  if ($("temp").value !== "") body.temperature = parseFloat($("temp").value);
  if ($("useOverride").checked && $("overrideText").value.trim()) body.system_override = $("overrideText").value;

  const bubble = addBubble("assistant", "");
  let acc = "";
  const resp = await fetch("/oth-path", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + $("token").value },
    body: JSON.stringify(body),
  });
  if (!resp.ok) { bubble.textContent = "[오류 " + resp.status + "]"; return; }

  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
      let ev = "message", data = "";
      for (const line of chunk.split("\n")) {
        if (line.startsWith("event:")) ev = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (!data) continue;
      const obj = JSON.parse(data);
      if (ev === "token") { acc += obj.text; bubble.textContent = acc; $("log").scrollTop = $("log").scrollHeight; }
      else if (ev === "done") {
        history.push({ role: "assistant", content: acc });
        $("finalMessages").textContent = JSON.stringify(obj.debug.final_messages, null, 2);
        $("finalMessages").className = "";
        $("personaBundle").textContent = JSON.stringify(obj.debug.persona_bundle, null, 2);
        $("personaBundle").className = "";
      } else if (ev === "error") { bubble.textContent = acc + "\n[error] " + obj.message; }
    }
  }
}

$("send").onclick = send;
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
