# prethird denoise A/B용 drop-in — 클론 reference voice.wav denoise ON.
#
# 운영 prethird는 정식 .service(/etc/systemd/system/afterlife-prethird.service, TTS=8201 qwen).
# 이 drop-in 으로 PRETHIRD_VOICE_DENOISE=1 을 override 한다(기본은 미설정=off).
#
# 배치(sudo):
#   scp denoise.conf afterlife-gabia:/tmp/denoise.conf
#   ssh afterlife-gabia "sudo cp /tmp/denoise.conf /etc/systemd/system/afterlife-prethird.service.d/denoise.conf \
#     && sudo systemctl daemon-reload && sudo systemctl restart afterlife-prethird"
# 끄기(sudo): 위 파일 rm + daemon-reload + restart.
#
# ⚠️ 효과 전 대상 클론 캐시 삭제 선행(없으면 기존 voice.wav 재사용 → denoise 미적용):
#   ssh afterlife-gabia "/home/afterlife/afterlife-server/prethird/scripts/_clear_voice_cache.sh <clone_id>"
[Service]
Environment=PRETHIRD_VOICE_DENOISE=1
