# prethird face-id 선제발화(face_event react) A/B용 drop-in — 토글 ON.
#
# 운영 prethird는 정식 .service(/etc/systemd/system/afterlife-prethird.service).
# 이 drop-in 으로 PRETHIRD_FACE_REACT_ENABLED=1 을 override 한다(기본은 미설정=off,
# signaling.py:_FACE_REACT_ENABLED_KEY — off면 face_event 수신해도 완전 무동작).
#
# 전제: 배포 선행 4단계 완료 후에만 켤 것(docs/AFTERLIFE_SYSTEM_MASTER.md §8 참조)
#   ① wrangler vectorize create afl-face-512 --dimensions=512 --metric=cosine
#   ② wrangler d1 migrations apply <DB> --remote  (0082/0083)
#   ③ wrangler deploy --env preview
#   ④ app_config UPSERT 'face.match_threshold' (Task 16 재캘리브 값)
#
# 배치(sudo):
#   scp facereact.conf afterlife-gabia:/tmp/facereact.conf
#   ssh afterlife-gabia "sudo cp /tmp/facereact.conf /etc/systemd/system/afterlife-prethird.service.d/facereact.conf \
#     && sudo systemctl daemon-reload && sudo systemctl restart afterlife-prethird"
#   (또는 afterlife-server/scripts/_remote_t067_deploy.sh --enable-react 로 일괄 수행)
#
# 끄기(sudo, 롤백): 위 파일 rm + daemon-reload + restart. 코드 롤백 불필요(회귀 0 설계).
#   ssh afterlife-gabia "sudo rm -f /etc/systemd/system/afterlife-prethird.service.d/facereact.conf \
#     && sudo systemctl daemon-reload && sudo systemctl restart afterlife-prethird"
[Service]
Environment=PRETHIRD_FACE_REACT_ENABLED=1
