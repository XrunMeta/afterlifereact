# SP4 Phase B — 통화 자산 pull(orchestrator ensureAssets)이 클론 음색 se.pth 를
# openvoice-afterlife/reference_voices/<cloneId>/se.pth 에 기록한다(tts_server REF_DIR 과 동일 경로).
# 기본 ReadWritePaths(testbed 디렉토리)에는 이 경로가 없어 ProtectHome=read-only 로 mkdir 이 ENOENT 차단됨.
# → reference_voices 를 쓰기 허용 경로에 추가. (idle/사진 자산은 testbed/video-ref·image-ref 라 기존 허용에 포함.)
# 적용: sudo systemctl daemon-reload && sudo systemctl restart afterlife-testbed
[Service]
ReadWritePaths=/home/afterlife/afterlife-server/openvoice-afterlife/reference_voices
