# SP4 — idle 영상 생성(orchestrator assetJobRunner → gen_idle_asset.sh → LivePortrait
# inference.py)이 구동 모션 캐시 d18.pkl 을
#   liveportrait-afterlife/source/assets/examples/driving/d18.pkl
# 에 (재)기록한다(io.py dump). 기본 ReadWritePaths(testbed 디렉토리)에 미포함 +
# ProtectHome=read-only 이므로 OSError [Errno 30] Read-only file system 으로 막힘.
#   → "gen exit 1: ... OSError: [Errno 30] Read-only file system: '.../driving/d18.pkl'"
# 헤드리스에서 가끔 성공한 건 d18.pkl 캐시가 살아있던 타이밍뿐 — 재생성 시 항상 실패.
# → liveportrait source 를 쓰기 허용 경로에 추가(#172 sp4b-asset-rw.conf 와 동일 패턴).
#   driving 외 source 내부 캐시도 커버하도록 source 디렉토리 전체 허용(source 밖은 ProtectSystem=full 로 보호 유지).
# 적용: sudo systemctl daemon-reload && sudo systemctl restart afterlife-testbed
[Service]
ReadWritePaths=/home/afterlife/afterlife-server/liveportrait-afterlife/source
