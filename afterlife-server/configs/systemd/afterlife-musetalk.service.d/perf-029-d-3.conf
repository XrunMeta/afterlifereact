[Service]
# 029-D-3 — fps 향상 환경변수
#  MUSETALK_BATCH_SIZE: unet+vae batch (16/32 모두 거의 동일)
#  MUSETALK_USE_SAVED_COORD: 같은 video 반복 시 landmark 추출 (~13s) 캐시 재사용
#  MUSETALK_STREAM_PUSH_WORKERS: publisher push 비동기 worker 수
Environment=MUSETALK_BATCH_SIZE=16
Environment=MUSETALK_USE_SAVED_COORD=1
Environment=MUSETALK_STREAM_PUSH_WORKERS=4
