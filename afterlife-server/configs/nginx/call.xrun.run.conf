# /etc/nginx/sites-available/rtc.example.invalid
# afterlife 가비아 서비스 전용 서브도메인 — Cloudflare proxied, Origin Cert *.xrun.run.
# memorial.example.invalid 이 CF Pages(웹 SPA)로 전환되며 /prethird·/orchestrator 경로가 SPA HTML 에
# 가로채여(CF 405/HTML) 가비아 origin 에 도달하지 못한 것을 우회하기 위한 분리 도메인.
#   - /prethird/*      : RN 통화 시그널링 (afterlife-prethird 8600)
#   - /orchestrator/*  : api → 가비아 클론 생성 잡 (asset-job idle영상 / persona-suggest, testbed 8100)
#   - /orchestrator-presecond/* : second(presecond) 경로 (8101)
# 미디어(a/v RTP)는 P2P 직결(UDP/ICE)이라 nginx 미경유 — 시그널링/HTTP 만 프록시.
# 배포: sites-enabled/ 에 symlink 후 `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name rtc.example.invalid;

    # origin 직접 접속(가비아 IP) 시 안전망. CF Always-Use-HTTPS 는 CF 에서 처리.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rtc.example.invalid;

    # Cloudflare Origin Certificate (*.xrun.run, valid 2026-2041) — memorial.example.invalid 과 공용.
    ssl_certificate     /etc/ssl/cloudflare/memorial.example.invalid.pem;
    ssl_certificate_key /etc/ssl/cloudflare/memorial.example.invalid.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # nginx 자체 헬스체크
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    # [T-256] verify — 대화 트레이닝 디버그 화면(L2·L2′·L1 지식). prethird 와 같은 8600.
    #
    # 🔑 왜 /prethird/verify 가 아니라 루트에 두는가:
    #    verify_chat.html 의 fetch 16개가 전부 **루트 절대경로**(`/oth-path`,
    #    `/oth-path` …)로 쓰여 있다. /prethird/ 접두사로 서빙하면 페이지는 떠도
    #    API 호출이 전부 루트로 나가 404 가 된다 — 화면만 보이고 로그인부터 실패한다.
    #    페이지를 고치려면 945줄 파일을 gabia 에서 직접 편집해야 해(prethird 는 git 아님)
    #    nginx 한 블록으로 맞추는 쪽을 택했다.
    #
    # ⚠️ proxy_pass 에 URI 를 붙이지 말 것 — 경로를 그대로 넘겨야 /oth-path* 가 보존된다.
    # ⚠️ proxy_buffering off 필수 — /oth-path 이 SSE 스트리밍이다. 켜두면 응답이
    #    한꺼번에 몰려 토큰 단위 출력이 죽는다.
    location /oth-path {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # prethird — 직결 WebRTC 아바타 스트리밍 시그널링 (afterlife-prethird, 127.0.0.1:8600)
    # /prethird/offer (SDP), /prethird/healthz. memorial.example.invalid 의 동일 location 과 1:1.
    location /prethird/ {
        proxy_pass http://127.0.0.1:8600/;
        proxy_http_version 1.1;

        # SDP 교환(/offer) 버퍼링/캐시/압축 비활성
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # orchestrator — api → 가비아 클론 생성 잡 (asset-job idle영상 / persona-suggest).
    # api 가 ${ORCHESTRATOR_URL}/oth-path* 로 호출. memorial.example.invalid 의 동일 location 과 1:1.
    location /orchestrator/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # orchestrator (presecond) — second 경로 (testbed-presecond 8101).
    location /orchestrator-presecond/ {
        proxy_pass http://127.0.0.1:8101/;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
