# lab-tuner(T-109/T-111) 웹 테스트베드 외부 노출 — rtc.example.invalid:8443 → 127.0.0.1:8700.
#
# 서버 배포 경로: /etc/nginx/sites-available/lab-edge.example.invalid
#   sudo install -m 644 <이파일> /etc/nginx/sites-available/lab-edge.example.invalid
#   sudo ln -sfn /etc/nginx/sites-available/lab-edge.example.invalid /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 원복: sites-enabled/ symlink 제거 후 동일하게 test + reload.
#
# lab-tuner 자체는 systemd unit 이 없다 — `run_testbed.py` 수동 기동(conda musetalk env).
# 기동 시 PRETHIRD_LEARN_ENABLED=0 을 강제하므로 테스트 대화가 L2 학습을 오염시키지 않는다.
#
# 왜 별도 포트인가:
#   tuner.js 가 /knobs·/offer·/promote/apply 등 **루트 절대경로**로 호출한다.
#   따라서 rtc.example.invalid/lab/ 같은 서브패스 프록시로는 동작 불가 → 루트를 통째로 주는
#   전용 포트가 필요. 8443 은 Cloudflare 가 프록시하는 HTTPS 대체 포트(443/2053/2083/
#   2087/2096/8443) 중 하나라 rtc.example.invalid 의 orange-cloud 상태 그대로 통과하며,
#   DNS 레코드 추가도 필요 없다.
#
# 라이브 통화(rtc.example.invalid:443, configs/nginx/rtc.example.invalid.conf)는 건드리지 않는다 —
# 포트가 달라 server 블록이 충돌하지 않으므로 이 파일만 독립적으로 추가/제거하면 된다.
#
# 인증 현황(2026-08-07 실측):
#   /oth-path                          401  ← 사용자 로그인(api /oth-path 프록시)
#   POST /oth-path /promote/restart  401  ← LAB_TUNER_TOKEN (환경변수 설정 확인됨)
#   /dev-token                       200  ← 2026-08-15 개방(히즈키 결정). 이전엔 403.
#                                    LAB_TUNER_TOKEN 을 그대로 반환한다 = promote/apply·
#                                    rollback·restart 와 /source/* 가 사실상 무인증.
#                                    자세한 사정과 원복 절차는 아래 location 자리 주석 참조.
#   /knobs /knobs/meta /live-status /production-status /runs
#                                    200 무인증 — 공개 테스트용으로 의도한 상태.
#                                    노브 값·실행중 prethird env 드리프트·과거 run 목록이 노출된다.
#   /sources /source/upload /source/thumb /source/delete
#                                    401  ← LAB_TUNER_TOKEN (2026-08-15 추가)
#                                    업로드한 얼굴 사진·영상이라 무인증으로 열지 않는다.
#                                    /dev-token 이 막혀 있어 외부 접속에서는 토큰이
#                                    자동 주입되지 않는다 → UI 의 렌더 소스 패널이
#                                    401 을 받으면 토큰 입력칸을 띄운다(tuner.js
#                                    _showSourceAuth). 토큰 원본은 서버의
#                                    /home/afterlife/.lab_tuner_token.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name rtc.example.invalid;

    # Cloudflare Origin Certificate (*.xrun.run) — rtc.example.invalid:443 과 공용.
    ssl_certificate     /etc/ssl/cloudflare/memorial.example.invalid.pem;
    ssl_certificate_key /etc/ssl/cloudflare/memorial.example.invalid.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 통화 테스트 시 wav/영상 업로드·리플레이 페이로드 여유.
    # 320m 인 이유: /source/upload 의 앱 상한이 300MB(source_lab.MAX_BYTES,
    # LAB_SOURCE_MAX_MB)라 여기가 더 낮으면 nginx 가 먼저 413(HTML)을 뱉어
    # "확장자·용량 안내" 대신 정체불명 오류가 보인다. 앱 상한을 올리면 여기도 같이 올릴 것.
    client_max_body_size 320m;

    access_log /var/log/nginx/lab-tuner.access.log;
    error_log  /var/log/nginx/lab-tuner.error.log;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    # ⚠️ /dev-token 개방 — 2026-08-15 히즈키 결정("테스터들만 아는 주소니까 오픈 괜찮아").
    #
    # 원래 여기서 403 으로 막고 있었다(2026-08-07). 이유: app.py 의 loopback 가드가
    # 프록시 뒤에서 무력화된다 — proxy_pass 대상이 127.0.0.1:8700 이라 aiohttp 가 보는
    # remote 는 항상 loopback 이라, 외부 요청이 전부 통과해 LAB_TUNER_TOKEN 이
    # 무인증으로 나간다(당시 실측: 외부에서 200 + 32자 토큰). 그래서 차단 + 토큰 회전.
    #
    # 지금은 그 유출을 **의도적으로 허용**한다. 랩 테스터가 매번 토큰을 붙여넣지 않고
    # 업로드 소스 패널을 쓰게 하기 위함이고, 접근 통제는 "주소를 아는 사람만 온다"에 맡긴다.
    #
    # 🔴 이 결정으로 함께 열리는 것 — 주소를 아는 누구나 아래를 할 수 있다:
    #     POST /oth-path    라이브 prethird systemd drop-in 에 노브 값 기록
    #     POST /oth-path 그 되돌리기
    #     POST /oth-path  라이브 prethird 재기동(통화 중이면 끊긴다)
    #     POST /oth-path    서버 디스크에 파일 쓰기(확장자·용량 상한은 있음)
    #     GET /oth-path /source/thumb  업로드된 얼굴 사진 열람
    # 랩 소스 기능만 열고 promote·재기동은 잠가 두고 싶으면, 이 location 을 되살리고
    # 소스 엔드포인트용 토큰을 LAB_TUNER_TOKEN 과 분리하면 된다.
    #
    # 원복(다시 잠그기):
    #     location = /dev-token { return 403; }
    # 를 되살리고 nginx -t && systemctl reload nginx. 토큰도 함께 회전할 것
    # (한 번 나간 값은 계속 유효하다).
    #
    # 일반화(이 사고에서 배운 것 — 결정과 무관하게 유효): remote_addr 기반 가드
    # (loopback 전용·IP allow)를 쓰는 서비스를 nginx 뒤에 새로 노출할 때는 그 가드가
    # 통째로 무력화된다고 가정하고 nginx 층에서 다시 막을지 먼저 판단한다.

    location / {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;

        # SDP 교환(/offer) 및 진행상황 스트리밍 응답 — 버퍼링/캐시/압축 비활성.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # 합성·렌더가 도는 동안 응답이 길다(TTS+fifth). 넉넉히.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
