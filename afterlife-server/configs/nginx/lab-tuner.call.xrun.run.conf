# lab-tuner(T-109/T-111) 웹 테스트베드 외부 노출 — rtc.example.invalid:8443 → 127.0.0.1:8700.
#
# 서버 배포 경로: /etc/nginx/sites-available/lab-edge.example.invalid
#   sudo install -m 644 <이파일> /etc/nginx/sites-available/lab-edge.example.invalid
#   sudo ln -sfn /etc/nginx/sites-available/lab-edge.example.invalid /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 원복: sites-enabled/ symlink 제거 후 동일하게 test + reload.
#
# lab-tuner 자체는 systemd unit 이 없다 — `run_testbed.py` 수동 기동(conda musetalk env).
# 기동 시 PRETHIRD_LEARN_ENABLED=0 을 강제하므로 테스트 대화가 L2 학습을 오염시키지 않는다.
#
# 왜 별도 포트인가:
#   tuner.js 가 /knobs·/offer·/promote/apply 등 **루트 절대경로**로 호출한다.
#   따라서 rtc.example.invalid/lab/ 같은 서브패스 프록시로는 동작 불가 → 루트를 통째로 주는
#   전용 포트가 필요. 8443 은 Cloudflare 가 프록시하는 HTTPS 대체 포트(443/2053/2083/
#   2087/2096/8443) 중 하나라 rtc.example.invalid 의 orange-cloud 상태 그대로 통과하며,
#   DNS 레코드 추가도 필요 없다.
#
# 라이브 통화(rtc.example.invalid:443, configs/nginx/rtc.example.invalid.conf)는 건드리지 않는다 —
# 포트가 달라 server 블록이 충돌하지 않으므로 이 파일만 독립적으로 추가/제거하면 된다.
#
# 인증 현황(2026-08-07 실측):
#   /oth-path                          401  ← 사용자 로그인(api /oth-path 프록시)
#   POST /oth-path /promote/restart  401  ← LAB_TUNER_TOKEN (환경변수 설정 확인됨)
#   /dev-token                       403  ← 아래 location 으로 차단 (필수, 이유는 해당 주석)
#   /knobs /knobs/meta /live-status /production-status /runs
#                                    200 무인증 — 공개 테스트용으로 의도한 상태.
#                                    노브 값·실행중 prethird env 드리프트·과거 run 목록이 노출된다.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name rtc.example.invalid;

    # Cloudflare Origin Certificate (*.xrun.run) — rtc.example.invalid:443 과 공용.
    ssl_certificate     /etc/ssl/cloudflare/memorial.example.invalid.pem;
    ssl_certificate_key /etc/ssl/cloudflare/memorial.example.invalid.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 통화 테스트 시 wav/영상 업로드·리플레이 페이로드 여유.
    client_max_body_size 64m;

    access_log /var/log/nginx/lab-tuner.access.log;
    error_log  /var/log/nginx/lab-tuner.error.log;

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
        access_log off;
    }

    # 🔴 필수 차단 — app.py 의 loopback 가드가 프록시 뒤에서 무력화된다.
    # /dev-token 은 LAB_TUNER_TOKEN(admin, promote/apply·rollback·restart 게이트)을
    # 그대로 반환하며 "loopback 전용 403" 으로만 보호된다. 그런데 proxy_pass 대상이
    # 127.0.0.1:8700 이라 aiohttp 가 보는 remote 는 항상 loopback → 외부 요청이 전부
    # 통과해 admin 토큰이 무인증 유출된다(2026-08-07 실측: 외부에서 200 + 32자 토큰).
    # 토큰이 필요하면 SSH 터널(ssh -N -L 8700:127.0.0.1:8700 afterlife-gabia)로
    # 직접 받아 UI 에 입력할 것.
    #
    # 일반화: remote_addr 기반 가드(loopback 전용·IP allow)를 쓰는 서비스를 nginx 뒤에
    # 새로 노출할 때는 그 가드가 통째로 무력화된다고 가정하고 nginx 층에서 다시 막는다.
    location = /dev-token {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;

        # SDP 교환(/offer) 및 진행상황 스트리밍 응답 — 버퍼링/캐시/압축 비활성.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # 합성·렌더가 도는 동안 응답이 길다(TTS+fifth). 넉넉히.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
