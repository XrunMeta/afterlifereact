<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>lab-tuner</title>
<style>
 /* questui 양피지 라이트 세트 — 크림 배경 + 진한 골드/브라운 액센트 */
 :root{--bg:#F4ECD8;--surface:#FBF6E9;--surface-2:#EFE3C9;--gold:#A16207;
   --gold-border:#CA8A04;--border:#D8C4A0;--red:#B91C1C;--purple:#6B21A8;
   --green:#15803D;--text:#3B2A1A;--text-dim:#7A6A52;}
 body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);
   color:var(--text);font-family:ui-monospace,"Fira Code",monospace}
 h3,h4,legend,.panel-title{font-family:"Cinzel",Georgia,serif;color:var(--gold);
   letter-spacing:.03em}
 #live-banner{display:none;position:fixed;top:0;left:0;right:0;background:var(--red);
   color:#FFF5E6;text-align:center;padding:6px;font-weight:bold;z-index:10}
 #login-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;
   background:var(--surface);border-bottom:1px solid var(--border);box-sizing:border-box}
 #main-row{display:flex;flex:1;min-height:0;flex-wrap:wrap}
 .col-left{width:360px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
 .col-right{flex:1;min-width:320px;padding:16px;overflow:auto;background:var(--surface)}
 #clone-video{width:288px;height:512px;background:#000;border:1px solid var(--border);border-radius:4px}
 input,select,button{font-family:inherit;color:var(--text);background:var(--surface);
   border:1px solid var(--border);border-radius:4px;padding:8px 12px}
 input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #CA8A0440}
 button{cursor:pointer}
 button.primary{background:var(--gold);color:#FFF5E6;border-color:var(--gold-border)}
 button:disabled{opacity:.35;cursor:not-allowed}
 /* 채널 카드 고정 2열 그리드(좁은 화면은 미디어쿼리로 1열) — 공간 밀도↑ */
 #knob-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
 .channel{background:var(--surface-2);border:1px solid var(--border);border-top:2px solid var(--gold);
   border-radius:4px;padding:12px;box-shadow:1px 2px 8px #CA8A0420}
 .channel .panel-title{font-size:14px;margin-bottom:8px;text-transform:capitalize}
 .knob-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;
   flex-wrap:wrap}
 .knob-row label{font-size:12px;color:var(--text-dim);display:flex;flex-direction:column}
 /* --- 압축 모드(기본): 노브 60종을 한눈에 --- */
 /* 채널 안에서 노브를 여러 열로 깔고, 설명·스펙은 접는다(행 tooltip 으로 확인). */
 body.compact .channel .knob-row{
   display:grid;grid-template-columns:1fr auto;align-items:center;
   gap:4px 6px;margin:0;padding:3px 4px;border-radius:3px}
 body.compact .channel .knob-row:hover{background:var(--surface)}
 body.compact .knob-desc,
 body.compact .knob-spec{display:none}
 body.compact .channel .knob-row label{font-size:11px;flex-direction:row;
   align-items:center;gap:4px;flex-wrap:wrap;line-height:1.3}
 body.compact .channel .knob-row .reflow-chip,
 body.compact .channel .knob-row .stage-tag{margin-top:0;font-size:8px;padding:0 4px}
 body.compact .knob-row input,body.compact .knob-row select{width:86px;padding:3px 5px;font-size:11px}
 body.compact .stepper input{width:52px}
 body.compact .stepper button{padding:3px 6px;font-size:11px;line-height:1}
 body.compact .kill-badge{grid-column:1/-1;margin:0 0 2px}
 /* 노브가 적은 섹션도 두 열로 채워 세로 길이를 줄인다 */
 body.compact .channel .knob-list{display:grid;
   grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 12px}
 /* 파라미터 설명 — 컨트롤 아래 전체 폭 한 줄 */
 .knob-desc{flex-basis:100%;font-size:11px;line-height:1.5;color:var(--text-dim);
   opacity:.85;margin:2px 0 2px;padding-left:1px}
 /* 실제 파라미터 이름 · 기본값 · 범위 */
 .knob-spec{flex-basis:100%;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
   font-size:10px;line-height:1.5;color:var(--text-dim);opacity:.62;
   margin:0 0 9px;padding-left:1px;word-break:break-all}
 .stage-tag{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.05em;
   color:var(--green);background:#15803D18;border-radius:2px;padding:1px 6px;
   margin-top:2px;width:max-content}
 /* 응답속도 구역 */
 #latency-panel{border-top:2px solid var(--green);margin-bottom:12px}
 #latency-meter{margin-bottom:10px}
 .lat-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:11px}
 .lat-name{color:var(--text-dim);min-width:72px}
 .lat-val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
 .lat-track{flex:1;height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
 .lat-bar{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
 /* FLP 읽기전용 */
 .knob-row.ro .ro-val{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
 .ro-group{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.08em;
   text-transform:uppercase;color:var(--gold);margin:10px 0 4px}
 /* 잠금 스위치에 무력화된 노브 경고 */
 .kill-badge{flex-basis:100%;font-size:10px;line-height:1.5;margin:1px 0 6px;
   padding:2px 6px;border-radius:3px;background:#B91C1C14;color:#B91C1C;
   font-weight:600;width:max-content}
 /* 최상단 고정 적용 바 — 노브가 길어 스크롤해도 항상 누를 수 있게 */
 #apply-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
   padding:8px 12px;margin-bottom:10px;background:var(--surface-2);
   border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:4px;
   box-shadow:0 2px 10px #CA8A0430}
 #apply-bar .apply-status{margin:0;flex:1}
 /* 렌더서버 로그 */
 #render-log{height:220px;overflow-y:auto;background:var(--surface);
   border-radius:4px;padding:6px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
   font-size:10px;line-height:1.55}
 .log-row{white-space:pre-wrap;word-break:break-all;color:var(--text-dim)}
 .log-row.final{color:var(--green);font-weight:600}
 .log-row.override{color:var(--gold)}
 .log-row.bad{color:#B91C1C}
 /* 마지막 렌더에 실제로 실려 간 값 */
 .last-sent{font-size:11px;line-height:1.6;margin:8px 0 10px;padding:7px 9px;
   background:var(--surface);border-radius:4px;border-left:2px solid var(--green)}
 .last-sent.empty{color:var(--text-dim);opacity:.7;border-left-color:var(--border)}
 .ls-head{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.05em;
   color:var(--text-dim);margin-bottom:3px}
 .ls-row{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
   word-break:break-all;color:var(--text-dim)}
 .ls-row.tuned{color:var(--green);font-weight:600}
 .ls-row.empty{color:var(--text-dim);opacity:.7;font-family:inherit}
 /* 적용 결과 — 값이 실제로 들어갔는지 즉시 알려준다 */
 .apply-status{font-size:11px;line-height:1.5;margin:-4px 0 10px;min-height:14px;
   color:var(--text-dim)}
 .apply-status.ok{color:var(--green)}
 .apply-status.warn{color:var(--gold)}
 .apply-status.bad{color:#B91C1C;font-weight:600}
 .reflow-chip{font-family:"Cinzel",serif;font-size:9px;letter-spacing:.05em;text-transform:uppercase;
   color:var(--gold);background:#CA8A0420;border-radius:2px;padding:1px 6px;margin-top:2px;width:max-content}
 .knob-row input,.knob-row select{width:120px}
 .stepper{display:flex;align-items:center}
 .stepper input{width:70px;text-align:center;border-radius:0}
 .stepper button{padding:6px 8px;background:var(--surface)}
 .knob-toggle{background:var(--surface)} .knob-seg{background:var(--surface)}
 .knob-dim{opacity:.4}
 #metrics{font-size:12px}
 .meter-row{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12px}
 .meter-row b{color:var(--text-dim);min-width:64px}
 .meter-row span{color:var(--text)}
 #runs table,#prod-status table{width:100%;border-collapse:collapse;font-size:12px}
 #runs td,#runs th,#prod-status td,#prod-status th{border-bottom:1px solid var(--surface-2);
   padding:4px;text-align:left}
 .chip{font-family:"Cinzel",serif;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
   border-radius:2px;padding:2px 8px}
 .chip-ok{background:#22C55E20;color:var(--green)}
 .chip-drift{background:#B91C1C20;color:var(--red)}
 .chip-unknown{background:var(--surface-2);color:var(--text-dim)}
 @media(max-width:900px){
   #main-row{flex-wrap:wrap}
   .col-left{width:100%}
   .col-right{width:100%;min-width:0}
   #knob-fields{grid-template-columns:1fr}
 }
</style></head><body class="compact">
 <div id="live-banner">라이브 통화 중 — 튜닝 대기</div>
 <div id="login-bar">
   <input id="login-email" placeholder="email" autocomplete="username" value="oth-test@example.invalid">
   <input id="login-pw" type="password" placeholder="password" autocomplete="current-password" value="">
   <button id="login-btn">로그인</button>
   <select id="clone-select" disabled><option value="">-- 클론 선택 --</option></select>
   <button id="connect-btn" disabled>연결</button>
   <button id="hangup-btn" disabled>끊기</button>
   <span id="login-status" style="font-size:12px;color:var(--text-dim)"></span>
   <span id="conn-status" style="font-size:12px;color:var(--green);margin-left:8px"></span>
 </div>
 <!-- 노브가 60종이라 스크롤이 길다 — 어디서든 적용할 수 있게 최상단 고정. -->
 <div id="apply-bar">
   <button id="apply-knobs-top" class="primary">적용</button>
   <button id="toggle-compact" type="button">설명 펼치기</button>
   <span id="apply-status-top" class="apply-status"></span>
 </div>
 <div id="main-row">
   <div class="col-left">
     <video id="clone-video" autoplay playsinline></video>
     <div style="display:flex;gap:6px">
       <input id="say-input" placeholder="말 걸기 (Enter 전송)" disabled style="flex:1">
       <button id="say-btn" disabled>say</button>
     </div>
     <div id="metrics"><h4>상태</h4><div id="metrics-out"></div></div>
     <div id="runs"><h4>Runs <button id="refresh-runs">새로고침</button></h4>
       <div id="runs-list"></div></div>
   </div>
   <div class="col-right">
     <div id="knobs-panel">
       <h3 class="panel-title">MIXER</h3>
       <div id="latency-panel" class="channel">
         <div class="panel-title">⚡ 응답속도 <span id="ttff-badge" class="reflow-chip">측정 전</span></div>
         <div id="latency-meter"></div>
         <div id="last-sent" class="last-sent empty"></div>
         <div id="latency-fields"></div>
       </div>
       <div id="knob-fields"></div>
       <div style="display:flex;gap:8px;margin:12px 0">
         <button id="apply-knobs" class="primary">적용</button>
         <button id="promote">라이브 적용</button>
         <button id="restart-prethird">재기동(restart)</button>
       </div>
       <div id="apply-status" class="apply-status"></div>
       <div id="promote-confirm" style="display:none"></div>
       <div id="restart-confirm" style="display:none"></div>
       <input id="promote-token" type="password" placeholder="LAB_TUNER_TOKEN"
         style="display:none;width:100%;box-sizing:border-box;margin-bottom:8px">
       <fieldset><legend>프로덕션 상태(read-only)</legend>
         <button id="refresh-prod">새로고침</button>
         <div id="prod-status"></div>
       </fieldset>
       <fieldset><legend>FLP 플러그인(read-only)</legend>
         <button id="refresh-flp" type="button">새로고침</button>
         <div id="flp-readonly"></div>
       </fieldset>
       <fieldset><legend>렌더서버 로그 — 실제 적용값 확인</legend>
         <div style="display:flex;gap:6px;margin-bottom:6px">
           <button id="log-pause" type="button">일시정지</button>
           <button id="log-clear" type="button">지우기</button>
           <span style="font-size:10px;color:var(--text-dim);align-self:center">
             cfg-final = 렌더에 실제로 쓰인 값</span>
         </div>
         <div id="render-log"></div>
       </fieldset>
     </div>
   </div>
 </div>
 <script src="/tuner.js"></script>
</body></html>
