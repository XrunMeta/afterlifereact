<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>lab-tuner</title>
<style>
 body{display:flex;font-family:sans-serif;margin:0;height:100vh}
 #knobs-panel{width:320px;overflow:auto;padding:12px;background:#f4f4f7}
 #center{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px}
 #metrics{width:300px;padding:12px;background:#f4f4f7;overflow:auto;font:12px monospace}
 #clone-video{width:288px;height:512px;background:#000}
 .knob{margin:6px 0} .knob label{display:block;font-size:12px}
 .knob .note{color:#a00;font-size:10px}
 fieldset{margin:8px 0}
 #live-banner{display:none;position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;
   text-align:center;padding:6px;font-weight:bold;z-index:10}
 #runs{width:100%;margin-top:12px;font-size:12px}
 #runs table{width:100%;border-collapse:collapse}
 #runs td,#runs th{border-bottom:1px solid #ddd;padding:4px;text-align:left}
 #prod-status table{width:100%;border-collapse:collapse;font-size:12px}
 #prod-status td,#prod-status th{border-bottom:1px solid #ddd;padding:4px;text-align:left}
</style></head><body>
 <div id="live-banner">라이브 통화 중 — 튜닝 대기</div>
 <div id="knobs-panel">
   <h3>Knobs</h3>
   <div id="knob-fields"></div>
   <button id="apply-knobs">적용</button>
   <button id="promote">라이브 적용</button>
   <fieldset><legend>프로덕션 상태(read-only)</legend>
     <button id="refresh-prod">새로고침</button>
     <div id="prod-status"></div>
   </fieldset>
 </div>
 <div id="center">
   <video id="clone-video" autoplay playsinline></video>
   <div><input id="say-input" placeholder="말 걸기"><button id="say-btn">say</button></div>
   <div id="runs">
     <h4>Runs <button id="refresh-runs">새로고침</button></h4>
     <div id="runs-list"></div>
   </div>
 </div>
 <div id="metrics"><h3>계측</h3><pre id="metrics-out"></pre></div>
 <script src="/tuner.js"></script>
</body></html>
