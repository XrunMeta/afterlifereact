name: afterlifeapi CI/CD

# 배포 트리거
#  - preview 브랜치 push  → afterlife-api-preview
#  - main    브랜치 push  → afterlife-api (production)
#  - PR (to preview)      → 검증만 (typecheck/test, deploy X)
#  - workflow_dispatch    → 수동, env 선택

on:
  push:
    branches: [main, preview]
    paths:
      - 'afterlifeapi/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [preview]
    paths:
      - 'afterlifeapi/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:
    inputs:
      env:
        description: 'wrangler env (preview | production)'
        type: choice
        options: [preview, production]
        default: preview
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterlifeapi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afterlifeapi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Create test .dev.vars (CI 더미 시크릿)
        run: |
          cat > .dev.vars <<'EOF'
          JWT_ACCESS_SECRET=ci-access-secret-local-only-32bytes-min
          JWT_REFRESH_SECRET=ci-refresh-secret-local-only-32bytes-min
          AUDIT_SECRET=ci-audit-secret-local-only-32bytes-min
          ALE_KEK=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MASTER_ROOT=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ADMIN_BOOTSTRAP_TOKEN=ci-bootstrap-token
          LAZY_V2_MIGRATE_ENABLED=0
          EOF

      - name: Test
        run: npm test
        # vitest miniflare 환경 — 외부 네트워크 불요

      # ---- 배포 단계 (PR 이벤트는 skip) ---------------------
      - name: Resolve deploy env
        if: github.event_name != 'pull_request'
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.env }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 환경별 D1 데이터베이스 이름 — wrangler.toml env 블록과 일치해야 함.
        #   preview    → afterlife-db      (PR #487 chore/preview-use-prod-db 이후 prod DB 공유)
        #   production → afterlife-db
        # wrangler 3.x 는 db name 을 인자로 요구 (binding 명 'DB' 로는 안됨).
        run: |
          DB_NAME="afterlife-db"
          echo "Applying migrations to $DB_NAME (env=${{ steps.env.outputs.env }})..."
          npx wrangler d1 migrations apply "$DB_NAME" --remote --env ${{ steps.env.outputs.env }}

      - name: Deploy (wrangler)
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env ${{ steps.env.outputs.env }}
