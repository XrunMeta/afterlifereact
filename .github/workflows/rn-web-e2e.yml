name: afterlifeRN Web E2E

# RN 앱의 회귀를 웹(Expo Web + Playwright)으로 잡는다 — T-454.
#
# 무엇을 검증하나: 폼·목록·설정·네비게이션의 **글 수정 · 버튼 누름 · 값 확인**.
# 무엇을 검증하지 않나: 통화·카메라·얼굴인식·권한 UI.
#   웹 번들에서 스텁이며(`afterlifeRN/metro.config.js` 의 WEB_STUB_MAP),
#   그 영역은 로컬 시뮬레이터 + Maestro + 사람이 정본이다.
#   → 이 워크플로가 초록색이라고 통화 기능이 정상이라는 뜻이 아니다.

on:
  pull_request:
    branches: [preview]
    paths:
      - 'afterlifeRN/**'
      - '.github/workflows/rn-web-e2e.yml'
  workflow_dispatch:

# 🔴 실 preview DB 의 **같은 검증 클론**(9116)에 쓰기를 한다.
#    동시 실행되면 서로의 값을 덮어 판정이 뒤집히므로 직렬화한다.
#    진행 중인 실행을 죽이지 않는다(cancel-in-progress: false) — 쓰기 중간에 끊기면
#    다음 실행이 어중간한 상태를 읽는다.
concurrency:
  group: rn-web-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: afterlifeRN

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: afterlifeRN/package-lock.json

      # 시크릿이 없으면(예: fork PR) 여기서 **이유를 말하고 멈춘다.**
      # 그냥 두면 로그인 401 로 죽어서 "제품이 깨졌다" 처럼 보인다.
      - name: Check credentials
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "::error::E2E_EMAIL / E2E_PASSWORD 시크릿이 없습니다."
            echo "fork PR 은 시크릿에 접근할 수 없습니다 — 이 경우 유지보수자가 재실행해야 합니다."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 사전 빌드. dev 서버(Metro)는 콜드 스타트가 수 분이라 CI 에 부적합하고,
      # export 산출물은 사용자가 받는 것과 같은 **프로덕션 번들**이라 검증 가치도 높다.
      - name: Build web bundle
        run: npx expo export --platform web

      # 🔴 `npx playwright` 를 쓰지 않는다. 다른 곳의 playwright 를 집으면
      #    "test.describe.configure() 를 config 에서 호출" 같은 엉뚱한 에러가 나고,
      #    에러가 테스트 코드를 가리켜 코드 문제로 오인하게 된다.
      # 러너가 로컬보다 느리다. 테스트당 타임아웃은 playwright.config.ts 에서 120초로
      # 잡아뒀다 — 기본 30초면 개별 assertion 의 60초 대기가 잘리고, 실패 메시지가
      # "화면에 도달 못 함" 으로 나와 세션·ID 문제로 오인하게 된다(로컬 실측에서 당함).
      - name: Run E2E (production bundle)
        env:
          CI: 'true'
          E2E_SERVER: static
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: ./node_modules/.bin/playwright test

      # 성공 실행의 산출물은 검토량만 늘린다 — 실패했을 때만 올린다.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: afterlifeRN/test-results/
          retention-days: 7
          if-no-files-found: ignore
