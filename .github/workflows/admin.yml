name: afterlifeadmin CI/CD

on:
  push:
    branches: [main, preview]
    paths:
      - 'afterlifeadmin/**'
  pull_request:
    branches: [preview]
    paths:
      - 'afterlifeadmin/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterlifeadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: afterlifeadmin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

