name: afterlifeadmin CI/CD

on:
  push:
    branches: [main, preview]
    paths:
      - 'afterlifeadmin/**'
  pull_request:
    branches: [preview]
    paths:
      - 'afterlifeadmin/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterlifeadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json 은 .gitignore 정책상 커밋 안 함 → npm ci(lock 필수) 대신 npm install.
      # 캐시도 lock 부재로 비활성(actions/setup-node cache 미지정).
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

