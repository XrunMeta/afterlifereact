name = "afterlife-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "87441deffba9e9c5c28114636686a4c7"

# Secrets (wrangler secret put <NAME>):
#   JWT_ACCESS_SECRET
#   JWT_REFRESH_SECRET
#   AUDIT_SECRET
#   ALE_KEK                    # base64 32B — v1/v2 하위호환
#   MASTER_ROOT                # base64 32B — ALE v3 KEK wrap/unwrap 루트
#   ADMIN_BOOTSTRAP_TOKEN      # dev/staging only

[vars]
ENVIRONMENT = "development"
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_RP_ORIGIN = "http://localhost:8787"
LAZY_ROTATION_ENABLED = "0"
LAZY_V2_MIGRATE_ENABLED = "0"

# Dev secrets (override via `wrangler secret put` or .dev.vars in real env)
[[d1_databases]]
binding = "DB"
database_name = "afterlife-db"
database_id = "09507858-14f8-4f3a-89e5-784244d592a4"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV_AUTH"
id = "1307484997f540849155979a695baabf"

[[kv_namespaces]]
binding = "KV_CTX"
id = "d76e3b7bc9df400d88b7601009246ae2"

[[kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "edf4f5a4f3f14426804cbba6dd6e0500"

[[kv_namespaces]]
binding = "KV_ONT"
id = "9151c3e0b1d640e0a66560b43b561c25"

[[kv_namespaces]]
binding = "KV_RATE"
id = "d64fe7f5a9ba4f87b0b626316b43fba1"

[[kv_namespaces]]
binding = "KV_SHARED"
id = "f77182b493dd4e36a1db4677afddaa0d"

[[kv_namespaces]]
binding = "KV_SHARED_VER"
id = "bdf9722018f541c59f50e6014696cddf"

[[r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "afterlife-media-dev"

[[r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "afterlife-archive-dev"

# M-6: cron — orphan clones 정기 스윕 (매일 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

# ─── preview 환경 ─────────────────────────────────────────
[env.preview]
name = "afterlife-api-preview"
[env.preview.vars]
ENVIRONMENT = "staging"
WEBAUTHN_RP_ID = "afterlife-api-preview.workers.dev"
WEBAUTHN_RP_ORIGIN = "https://afterlife-api-preview.workers.dev"
LAZY_ROTATION_ENABLED = "0"
LAZY_V2_MIGRATE_ENABLED = "0"

# ─── production 환경 ──────────────────────────────────────
[env.production]
name = "afterlife-api"
[env.production.vars]
ENVIRONMENT = "production"
WEBAUTHN_RP_ID = "api.afterlife.app"
WEBAUTHN_RP_ORIGIN = "https://oth-path.afterlife.app"
LAZY_ROTATION_ENABLED = "0"
LAZY_V2_MIGRATE_ENABLED = "0"
