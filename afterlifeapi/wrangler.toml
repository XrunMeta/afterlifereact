name = "afterlife-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "87441deffba9e9c5c28114636686a4c7"

# Secrets (wrangler secret put <NAME>):
#   JWT_ACCESS_SECRET
#   JWT_REFRESH_SECRET
#   AUDIT_SECRET
#   ALE_KEK                    # base64 32B — v1/v2 하위호환
#   MASTER_ROOT                # base64 32B — ALE v3 KEK wrap/unwrap 루트
#   ADMIN_BOOTSTRAP_TOKEN      # dev/staging only
#   GOOGLE_CLIENT_ID           # 회원가입 OTP 발송용 Gmail API OAuth 클라이언트
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN       # scripts/get-google-refresh-token.mjs 로 1회 발급
#   GMAIL_SENDER               # 발송 From 주소 (예: oth-staff@example.invalid)
#   XRUN_GATEWAY_TOKEN         # xrun gateway TOKEN_VALIDATOR — paymentPin 등 보호 endpoint 호출

# R2 바인딩 — uploadedfiles/ 경로에 사용자 업로드 이미지 저장.

# ─── local dev 바인딩 ───────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "afterlife-db-preview"
database_id = "a9d363db-5838-4697-acf9-c49eb04c6359"
migrations_dir = "migrations"

# xrun D1 — afterlife 측 이메일 발송 시 sender='afterlife' 로 EmailLogs 에
# row 기록. xrun-admin 의 이메일 관리 페이지가 한 곳에서 양쪽 발송내역 조회.
[[d1_databases]]
binding = "XRUN_DB"
database_name = "xrun"
database_id = "f446edf4-05aa-45c0-a5b1-67f1f96a9544"

[[r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "afterlife-archive-dev"

[[kv_namespaces]]
binding = "KV_AUTH"
id = "1307484997f540849155979a695baabf"

[[kv_namespaces]]
binding = "KV_CTX"
id = "d76e3b7bc9df400d88b7601009246ae2"

[[kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "edf4f5a4f3f14426804cbba6dd6e0500"

[[kv_namespaces]]
binding = "KV_ONT"
id = "9151c3e0b1d640e0a66560b43b561c25"

[[kv_namespaces]]
binding = "KV_RATE"
id = "d64fe7f5a9ba4f87b0b626316b43fba1"

[[kv_namespaces]]
binding = "KV_SHARED"
id = "f77182b493dd4e36a1db4677afddaa0d"

[[kv_namespaces]]
binding = "KV_SHARED_VER"
id = "bdf9722018f541c59f50e6014696cddf"

[vars]
ENVIRONMENT = "development"
# SP1a — gabia orchestrator. dev/test 는 실제 호출 안 함(vitest fetchMock 대상). preview/prod 는 실 URL.
ORCHESTRATOR_URL = "http://orchestrator.test"
WEBAUTHN_RP_ID = "localhost"
WEBAUTHN_RP_ORIGIN = "http://localhost:8787"
LAZY_ROTATION_ENABLED = "0"
LAZY_V2_MIGRATE_ENABLED = "0"
L2_PREF_HISTORY_ENABLED = "0"
XRUN_API_URL = "https://oth-path-gw.example.invalid"
# 결제 wallets — 회사 보유 외부 EOA. 사용자 wallet 에서 분할 송금 대상.
COMPANY_CHARGE_WALLET = "0x869D509b78135B7b325E31adD2d42871F3967524"
COMPANY_GIFT_WALLET   = "0xe2b76Fc0341032EAc600af08f338577455C5F858"
PAYMENT_CURRENCY      = "11"
# 통화 엔드포인트 원격 config — D1(app_config) 미조회 시 폴백. 값 = 현재 라이브 rtc.example.invalid.
CALL_PRETHIRD_BASE = "https://rtc.example.invalid/prethird"
CALL_ROUTE = "prethird"
FACE_CALIBRATE_ENABLED = "0"   # T-111: 개통 전 제거
FACE_CONSENT_ENFORCED = "false"  # T-126 Task6: dev 기본 OFF(preview와 동일)

# M-6: cron — orphan clones 정기 스윕 (매일 03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

# ─── preview 환경 ─────────────────────────────────────────
[env.preview]
# name 미지정 → wrangler가 자동으로 "afterlife-api-preview" 사용

# ⚠️ 임시(히즈키 요청): preview 워커가 PROD DB(afterlife-db)를 바라본다.
#   → preview 빌드 테스트가 prod 데이터를 읽고 **쓴다**(신규 클론 등 prod 기록).
#   원복: database_name/id 를 afterlife-db-preview(a9d363db-...)로 되돌리고 재배포.
#   ⚠️ preview cron·`d1 migrations apply --env preview`도 prod DB 대상이 되니 주의.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "afterlife-db"
database_id = "09507858-14f8-4f3a-89e5-784244d592a4"
migrations_dir = "migrations"

[[env.preview.d1_databases]]
binding = "XRUN_DB"
database_name = "xrun"
database_id = "f446edf4-05aa-45c0-a5b1-67f1f96a9544"

[[env.preview.kv_namespaces]]
binding = "KV_AUTH"
id = "1307484997f540849155979a695baabf"

[[env.preview.kv_namespaces]]
binding = "KV_CTX"
id = "d76e3b7bc9df400d88b7601009246ae2"

[[env.preview.kv_namespaces]]
binding = "KV_IDEMPOTENCY"
id = "edf4f5a4f3f14426804cbba6dd6e0500"

[[env.preview.kv_namespaces]]
binding = "KV_ONT"
id = "9151c3e0b1d640e0a66560b43b561c25"

[[env.preview.kv_namespaces]]
binding = "KV_RATE"
id = "d64fe7f5a9ba4f87b0b626316b43fba1"

[[env.preview.kv_namespaces]]
binding = "KV_SHARED"
id = "f77182b493dd4e36a1db4677afddaa0d"

[[env.preview.kv_namespaces]]
binding = "KV_SHARED_VER"
id = "bdf9722018f541c59f50e6014696cddf"

[[env.preview.r2_buckets]]
binding = "R2_ARCHIVE"
bucket_name = "afterlife-archive-dev"

# T-067 얼굴 화자 식별 — 벡터 인덱스(코사인, 512d w600k_mbf 임베딩).
# 인덱스 생성은 배포 단계: wrangler vectorize create afl-face-512 --dimensions=512 --metric=cosine
[[env.preview.vectorize]]
binding = "FACE_VECTORS"
index_name = "afl-face-512"

[env.preview.vars]
ENVIRONMENT = "staging"
ORCHESTRATOR_URL = "https://rtc.example.invalid/orchestrator"  # ORCH_SECRET 은 wrangler secret put. rtc.example.invalid: memorial.example.invalid CF Pages 전환으로 /orchestrator 가로채여 이전(통화 /prethird 와 동일)
WEBAUTHN_RP_ID = "edge-alt-preview.example.invalid"
WEBAUTHN_RP_ORIGIN = "https://edge-alt-preview.example.invalid"
LAZY_ROTATION_ENABLED = "0"
LAZY_V2_MIGRATE_ENABLED = "0"
L2_PREF_HISTORY_ENABLED = "1"
XRUN_API_URL = "https://oth-path-gw.example.invalid"
# 결제 wallets — 회사 보유 외부 EOA. 사용자 wallet 에서 분할 송금 대상.
COMPANY_CHARGE_WALLET = "0x869D509b78135B7b325E31adD2d42871F3967524"
COMPANY_GIFT_WALLET   = "0xe2b76Fc0341032EAc600af08f338577455C5F858"
PAYMENT_CURRENCY      = "11"
# 통화 엔드포인트 원격 config — D1(app_config) 미조회 시 폴백. 값 = 현재 라이브 rtc.example.invalid.
CALL_PRETHIRD_BASE = "https://rtc.example.invalid/prethird"
CALL_ROUTE = "prethird"
# [T-252 후속 · 2026-08-10 KST 히즈키 지시] preview 만 계측 ON.
# 얼굴 인식 사이클마다 face_calibrate_samples 에 (best_score·threshold·전 person 유사도·
# matched_has_l2p) 를 남긴다 — 인식이 실제로 되는지, 유사도 분포가 어떤지를 데이터로 본다.
# prod([env.production])는 "0" 유지 — 매 사이클 D1 write 라 실사용자에게 켜면 안 된다.
# T-111 개통 전 제거 대상(테이블 DROP)이라는 원래 방침은 그대로다.
FACE_CALIBRATE_ENABLED = "1"
FACE_CONSENT_ENFORCED = "false"  # T-126 Task6: preview 기본 OFF — auto_biometric 조용한 자동등록 실기검증
# preview/dev 전용 결제 우회 PIN — 이 PIN 으로 페르소나 결제 시 xrun 송금 스킵(테스트).
# production([env.production])에는 절대 추가 금지. preview 한정.
DEV_PAYMENT_BYPASS_PIN = "424242"
# T-155: preview 도 클론 생성 결제 우회(PIN 없이 무료 게시). prod 와 동일 정책.
#   ⚠️ 실 XRUN_GATEWAY_TOKEN 확보(T-156) 후 원복 시 prod·preview 양쪽에서 제거.
CLONE_PAYMENT_BYPASS = "1"

[env.preview.triggers]
crons = ["0 3 * * *"]

