};

const TW = 200;    
const ROW_H = 16;  
const HDR_H = 28;  
const PAD = 6;     
const GP = 12;     
const GTH = 26;    

function tableH(t) {
  return HDR_H + PAD + t.columns.length * ROW_H + PAD;
}

function layGroup(gid) {
  const tables = TABLES.filter(t => t.g === gid);
  const cols = gid === 'kv' ? 2 : gid === 'system' ? 2 : gid === 'clones' ? 2 : 2;
  const gapX = 12, gapY = 12;
  const maxH = tables.length ? Math.max(...tables.map(tableH)) : 80;
  tables.forEach((t, i) => {
    t._lx = GP + (i % cols) * (TW + gapX);
    t._ly = GTH + GP + Math.floor(i / cols) * (maxH + gapY);
    t._h = tableH(t);
  });
  const nc = Math.min(tables.length, cols);
  const nr = Math.ceil(tables.length / cols);
  return {
    w: GP * 2 + nc * TW + Math.max(0, nc - 1) * gapX,
    h: GTH + GP * 2 + nr * (maxH + gapY) - gapY + 8,
  };
}

const GS = {};
Object.keys(GM).forEach(gid => {
  const sz = layGroup(gid);
  const dp = DPOS[gid] || {x: 0, y: 0};
  GS[gid] = {x: dp.x, y: dp.y, w: sz.w, h: sz.h};
});

function saveState() {
  const s = {g: {}, n: {}};
  Object.keys(GS).forEach(gid => { s.g[gid] = {x: GS[gid].x, y: GS[gid].y}; });
  TABLES.forEach(t => { s.n[t.id] = {x: t._lx, y: t._ly}; });
  localStorage.setItem(SKEY, JSON.stringify(s));
  showToast('Layout saved!');
  const btn = document.getElementById('btnSave');
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 600);
}

    const s = JSON.parse(r);
    if (s.g) Object.entries(s.g).forEach(([k, v]) => { if (GS[k]) { GS[k].x = v.x; GS[k].y = v.y; }});
    if (s.n) Object.entries(s.n).forEach(([k, v]) => { const t = TABLES.find(tt => tt.id === k); if (t) { t._lx = v.x; t._ly = v.y; }});
  } catch(e) {}
}

function clearState() { localStorage.removeItem(SKEY); showToast('Cleared. Reload to reset.'); }

function exportHTML() {
  const state = {g: {}, n: {}};
  Object.keys(GS).forEach(gid => { state.g[gid] = {x: GS[gid].x, y: GS[gid].y}; });
  TABLES.forEach(t => { state.n[t.id] = {x: t._lx, y: t._ly}; });
  const stateJSON = JSON.stringify(state);
  const html = document.documentElement.outerHTML;
  const marker = 'loadState();';
  const injection = `\n// BAKED STATE (exported)\n(function(){try{const s=${stateJSON};if(s.g)Object.entries(s.g).forEach(([k,v])=>{if(GS[k]){GS[k].x=v.x;GS[k].y=v.y}});if(s.n)Object.entries(s.n).forEach(([k,v])=>{const t=TABLES.find(tt=>tt.id===k);if(t){t._lx=v.x;t._ly=v.y}});} catch(e){}})();\n`;
  const exported = '<!DOCTYPE html><html lang="ko">' + html.replace(marker, marker + injection);
  const blob = new Blob([exported], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'afterlife-erd-export.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Exported with current layout!');
}

loadState();

function cp(text) { navigator.clipboard.writeText(text).then(() => showToast('✅ ' + text)); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

const vp = document.getElementById('viewport');
const svg = document.getElementById('canvas');
const S = (tag, a) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(a || {})) e.setAttribute(k, v);
  return e;
};
const T = (x, y, txt, a) => { const e = S('text', {x, y, ...a}); e.textContent = txt; return e; };

const defs = S('defs'); svg.insertBefore(defs, svg.firstChild);
['#6366f1','#8b5cf6','#3b82f6','#10b981','#f59e0b','#64748b','#ec4899','#cbd5e1'].forEach(c => {
  const m = S('marker', {id: 'm'+c.slice(1), markerWidth:8, markerHeight:6, refX:8, refY:3, orient:'auto', markerUnits:'strokeWidth'});
  m.appendChild(S('polygon', {points:'0 0,8 3,0 6', fill:c}));
  defs.appendChild(m);
});

let scale = 0.72, tx = 20, ty = 10;
function upT() { vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }
function zoomIn()  { scale = Math.min(scale * 1.15, 3); upT(); }
function zoomOut() { scale = Math.max(scale / 1.15, 0.1); upT(); }
function resetView() { scale = 0.72; tx = 20; ty = 10; upT(); }

const edgeLayer = S('g', {id: 'edges'});
vp.appendChild(edgeLayer);

let highlightedNode = null;

const gEls = {};
Object.entries(GM).forEach(([gid, meta]) => {
  const gs = GS[gid];
  const gEl = S('g', {'data-group': gid});
  gEl.setAttribute('transform', `translate(${gs.x},${gs.y})`);
  gEls[gid] = gEl;

  const isKV = gid === 'kv';

  gEl.appendChild(S('rect', {
    x:0, y:0, width:gs.w, height:gs.h, rx:6,
    fill: isKV ? '#fdf4ff' : '#fff',
    stroke: meta.color + (isKV ? '99' : '40'),
    'stroke-width': isKV ? 1.5 : 1.5,
    'stroke-dasharray': isKV ? '6 3' : '5 3',
  }));

  gEl.appendChild(S('rect', {x:0, y:0, width:gs.w, height:GTH, rx:6, fill: meta.color + '18'}));
  gEl.appendChild(S('rect', {x:0, y:13, width:gs.w, height:13, fill: meta.color + '18'}));

  gEl.appendChild(T(10, 17, meta.label, {'font-size':'10px','font-weight':'700', fill:meta.color,'font-family':'inherit'}));
  if (isKV) {
    gEl.appendChild(T(gs.w - 10, 17, 'KV Pattern', {'font-size':'8px', fill:meta.color+'99','text-anchor':'end','font-family':'inherit'}));
  }

  let dr = 0, sx, sy, ox, oy;
  gEl.addEventListener('mousedown', e => {
    if (e.target.closest('.erd-table')) return;
    dr = 1; sx = e.clientX; sy = e.clientY; ox = gs.x; oy = gs.y; e.stopPropagation();
  });
  window.addEventListener('mousemove', e => {
    if (!dr) return;
    gs.x = ox + (e.clientX - sx) / scale;
    gs.y = oy + (e.clientY - sy) / scale;
    gEl.setAttribute('transform', `translate(${gs.x},${gs.y})`);
    drawEdges();
  });
  window.addEventListener('mouseup', () => { dr = 0; });

  vp.appendChild(gEl);
});

const nodeEls = {};

TABLES.forEach(t => {
  const gEl = gEls[t.g]; if (!gEl) return;
  const g = S('g', {class: 'erd-table', cursor: 'default'});
  g.setAttribute('transform', `translate(${t._lx},${t._ly})`);
  t._el = g; nodeEls[t.id] = g;
  const h = t._h;

  g.appendChild(S('rect', {
    x:0, y:0, width:TW, height:h, rx:4,
    fill:'#fff', stroke:t.c, 'stroke-width': t.kv ? 1.2 : 1.8,
    'stroke-dasharray': t.kv ? '5 3' : 'none',
  }));

  g.appendChild(S('rect', {x:0, y:0, width:TW, height:HDR_H, rx:4, fill: t.c + '20'}));
  g.appendChild(S('rect', {x:0, y:14, width:TW, height:14, fill: t.c + '20'}));

  if (t.kv) {
    const badge = T(TW - PAD, 10, 'KV', {'font-size':'7px','font-weight':'700', fill:t.c+'cc','text-anchor':'end','font-family':'inherit'});
    g.appendChild(badge);
  }

  const nm = T(PAD, 18, t.label, {'font-size':'11px','font-weight':'700', fill:t.c,'font-family':'inherit', cursor:'pointer'});
  nm.addEventListener('click', e => { e.stopPropagation(); cp(t.label); });
  g.appendChild(nm);

  g.appendChild(S('line', {x1:0, y1:HDR_H, x2:TW, y2:HDR_H, stroke:t.c+'40','stroke-width':1}));

  let yO = HDR_H + PAD;
  t.columns.forEach(col => {

    if (col.fk) {
      g.appendChild(S('rect', {x:0, y:yO-1, width:TW, height:ROW_H, fill: t.c + '08'}));
    }

    let icon = '';
    if (col.pk) icon = '🔑 ';
    else if (col.fk) icon = '→ ';

    const colText = T(PAD + 2, yO + 11, icon + col.name, {
      'font-size': '9.5px',
      fill: col.pk ? t.c : col.fk ? '#475569' : '#64748b',
      'font-weight': col.pk ? '700' : col.fk ? '600' : '400',
      'font-family': 'inherit',
      cursor: 'pointer',
    });
    colText.addEventListener('click', e => {
      e.stopPropagation();
      cp(col.fk ? `${t.label}.${col.name} → ${col.fk}.id` : `${t.label}.${col.name}`);
    });
    g.appendChild(colText);

    if (col.fk) {
      const ref = T(TW - PAD, yO + 11, col.fk, {
        'font-size':'8px', fill: t.c + 'aa', 'text-anchor':'end', 'font-family':'inherit',
      });
      g.appendChild(ref);
    }

    yO += ROW_H;
  });

  g.addEventListener('mouseenter', () => { highlightedNode = t.id; drawEdges(); });
  g.addEventListener('mouseleave', () => { highlightedNode = null; drawEdges(); });

  let nd = 0, nsx, nsy, nlx, nly;
  g.addEventListener('mousedown', e => {
    nd = 1; nsx = e.clientX; nsy = e.clientY; nlx = t._lx; nly = t._ly; e.stopPropagation();
  });
  window.addEventListener('mousemove', e => {
    if (!nd) return;
    t._lx = nlx + (e.clientX - nsx) / scale;
    t._ly = nly + (e.clientY - nsy) / scale;
    g.setAttribute('transform', `translate(${t._lx},${t._ly})`);
    drawEdges();
  });
  window.addEventListener('mouseup', () => { nd = 0; });

  gEl.appendChild(g);
});

function tableAbsPos(tid) {
  const t = TABLES.find(tt => tt.id === tid); if (!t) return null;
  const gs = GS[t.g];
  return {x: gs.x + t._lx, y: gs.y + t._ly, w: TW, h: t._h};
}

function getBestPorts(from, to) {
  const fp = tableAbsPos(from), tp = tableAbsPos(to); if (!fp || !tp) return null;
  const fcx = fp.x + fp.w / 2, fcy = fp.y + fp.h / 2;
  const tcx = tp.x + tp.w / 2, tcy = tp.y + tp.h / 2;
  const dx = tcx - fcx, dy = tcy - fcy;

  let fSide, fx, fy;
  if (Math.abs(dx) > Math.abs(dy)) {
    fSide = dx > 0 ? 'r' : 'l';
    fx = dx > 0 ? fp.x + fp.w : fp.x;
    fy = fcy;
  } else {
    fSide = dy > 0 ? 'b' : 't';
    fx = fcx;
    fy = dy > 0 ? fp.y + fp.h : fp.y;
  }

  let tSide, ttx, tty;
  if (Math.abs(dx) > Math.abs(dy)) {
    tSide = dx > 0 ? 'l' : 'r';
    ttx = dx > 0 ? tp.x : tp.x + tp.w;
    tty = tcy;
  } else {
    tSide = dy > 0 ? 't' : 'b';
    ttx = tcx;
    tty = dy > 0 ? tp.y : tp.y + tp.h;
  }

  return {fx, fy, fSide, ttx, tty, tSide};
}

function orthoPathRounded(x1, y1, s1, x2, y2, s2, channelOffset) {
  const gap = 22 + (channelOffset || 0) * 7;
  let pts = [{x:x1, y:y1}];

  let ex = x1, ey = y1;
  if (s1==='r') ex += gap; else if (s1==='l') ex -= gap;
  else if (s1==='b') ey += gap; else ey -= gap;
  pts.push({x:ex, y:ey});

  let nx = x2, ny = y2;
  if (s2==='r') nx += gap; else if (s2==='l') nx -= gap;
  else if (s2==='b') ny += gap; else ny -= gap;

  const horiz1 = s1==='r' || s1==='l';
  const horiz2 = s2==='r' || s2==='l';
  if (horiz1 && horiz2) {
    const mx = (ex + nx) / 2 + (channelOffset || 0) * 5;
    pts.push({x:mx, y:ey}); pts.push({x:mx, y:ny});
  } else if (horiz1 && !horiz2) {
    pts.push({x:nx, y:ey});
  } else if (!horiz1 && horiz2) {
    pts.push({x:ex, y:ny});
  } else {
    const my = (ey + ny) / 2 + (channelOffset || 0) * 5;
    pts.push({x:ex, y:my}); pts.push({x:nx, y:my});
  }
  pts.push({x:nx, y:ny}); pts.push({x:x2, y:y2});

  const clean = [];
  pts.forEach(p => {
    if (clean.length === 0 ||
        Math.abs(p.x - clean[clean.length-1].x) > 0.5 ||
        Math.abs(p.y - clean[clean.length-1].y) > 0.5)
      clean.push(p);
  });

  const R = 7;
  let d = `M${clean[0].x.toFixed(1)},${clean[0].y.toFixed(1)}`;
  for (let i = 1; i < clean.length; i++) {
    if (i < clean.length - 1) {
      const prev = clean[i-1], cur = clean[i], next = clean[i+1];
      const dx1 = cur.x - prev.x, dy1 = cur.y - prev.y;
      const dx2 = next.x - cur.x, dy2 = next.y - cur.y;
      const len1 = Math.sqrt(dx1*dx1 + dy1*dy1);
      const len2 = Math.sqrt(dx2*dx2 + dy2*dy2);
      if (len1 < 1 || len2 < 1) { d += ` L${cur.x.toFixed(1)},${cur.y.toFixed(1)}`; continue; }
      const r = Math.min(R, len1/2, len2/2);
      const bx = cur.x - (dx1/len1)*r, by = cur.y - (dy1/len1)*r;
      const ax = cur.x + (dx2/len2)*r, ay = cur.y + (dy2/len2)*r;
      const cross = dx1*dy2 - dy1*dx2;
      const sweep = cross > 0 ? 1 : 0;
      d += ` L${bx.toFixed(1)},${by.toFixed(1)}`;
      d += ` A${r},${r} 0 0 ${sweep} ${ax.toFixed(1)},${ay.toFixed(1)}`;
    } else {
      d += ` L${clean[i].x.toFixed(1)},${clean[i].y.toFixed(1)}`;
    }
  }
  return {d, pts: clean};
}

function labelPos(pts) {
  let bestLen = 0, bestMid = null, bestAngle = 'h';
  for (let i = 0; i < pts.length - 1; i++) {
    const dx = pts[i+1].x - pts[i].x, dy = pts[i+1].y - pts[i].y;
    const len = Math.sqrt(dx*dx + dy*dy);
    if (len > bestLen) {
      bestLen = len;
      bestMid = {x:(pts[i].x+pts[i+1].x)/2, y:(pts[i].y+pts[i+1].y)/2};
      bestAngle = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
  }
  return {pos: bestMid || {x:0, y:0}, orient: bestAngle};
}

function assignChannels() {
  const groups = {};
  EDGES.forEach((e, i) => {
    const key = e.from;
    if (!groups[key]) groups[key] = [];
    groups[key].push(i);
  });
  const channels = new Array(EDGES.length).fill(0);
  Object.values(groups).forEach(indices => {
    if (indices.length <= 1) return;
    indices.forEach((ei, j) => { channels[ei] = j - (indices.length - 1) / 2; });
  });
  return channels;
}

function drawEdges() {
  while (edgeLayer.firstChild) edgeLayer.removeChild(edgeLayer.firstChild);

  const isHL = highlightedNode !== null;
  const connEI = new Set(), connNI = new Set();
  if (isHL) {
    EDGES.forEach((e, i) => {
      if (e.from === highlightedNode || e.to === highlightedNode) {
        connEI.add(i); connNI.add(e.from); connNI.add(e.to);
      }
    });
  }

  TABLES.forEach(t => {
    if (!t._el) return;
    t._el.setAttribute('opacity', isHL && !connNI.has(t.id) ? '0.12' : '1');
  });

  const channels = assignChannels();

  EDGES.forEach((e, ei) => {
    const ports = getBestPorts(e.from, e.to); if (!ports) return;
    const {fx, fy, fSide, ttx, tty, tSide} = ports;

    const isConn = !isHL || connEI.has(ei);
    const opacity = isConn ? 0.85 : 0.05;

    const {d, pts} = orthoPathRounded(fx, fy, fSide, ttx, tty, tSide, channels[ei]);

    const path = S('path', {
      d, fill:'none', stroke:e.c, 'stroke-width': isConn ? 1.8 : 1,
      'marker-end': `url(#m${e.c.slice(1)})`, opacity,
    });
    edgeLayer.appendChild(path);

    if (isConn) {
      edgeLayer.appendChild(S('circle', {cx:fx, cy:fy, r:3, fill:e.c, opacity:0.9}));
      edgeLayer.appendChild(S('circle', {cx:ttx, cy:tty, r:3, fill:e.c, opacity:0.9}));
    }

    if (e.label && isConn) {
      const {pos, orient} = labelPos(pts);
      const tw = e.label.length * 7 + 14;
      const th = 16;
      let lx = pos.x, ly = pos.y;
      if (orient === 'h') ly -= 10; else lx += 10;

      edgeLayer.appendChild(S('rect', {
        x: lx - tw/2, y: ly - th/2 + 1, width:tw, height:th, rx:8,
        fill:'#fff', stroke:e.c, 'stroke-width':1, opacity:0.95,
      }));
      const lt = T(lx, ly + 4, e.label, {
        'font-size':'8px','font-weight':'700', fill:e.c,
        'text-anchor':'middle','font-family':'inherit', cursor:'pointer',
      });
      lt.addEventListener('click', ev => {
        ev.stopPropagation();
        const fT = TABLES.find(tt => tt.id === e.from);
        const tT = TABLES.find(tt => tt.id === e.to);
        cp(`${fT?.label||e.from} → ${tT?.label||e.to} [${e.label}]`);
      });
      edgeLayer.appendChild(lt);
    }
  });
}

drawEdges();

let isPan = 0, psx, psy;
svg.addEventListener('mousedown', e => {
  if (e.target.closest('[data-group]') || e.target.closest('.erd-table')) return;
  isPan = 1; psx = e.clientX - tx; psy = e.clientY - ty;
  svg.style.cursor = 'grabbing';
});
svg.addEventListener('mousemove', e => {
  if (!isPan) return;
  tx = e.clientX - psx; ty = e.clientY - psy; upT();
});
svg.addEventListener('mouseup', () => { isPan = 0; svg.style.cursor = 'default'; });
svg.addEventListener('mouseleave', () => { isPan = 0; svg.style.cursor = 'default'; });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.92 : 1.08;
  const ns = Math.min(Math.max(scale * d, 0.1), 3);
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns; upT();
}, {passive: false});

upT();
</script>
</body>
</html>
